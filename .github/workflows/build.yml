name: C++ Build, Tarball, and Debian Package

on:
  push:
    branches:
      - branchAutomake  # Add this branch to create a tarball
  pull_request:
    branches:
      - branchAutomake

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up C++ environment
        run: sudo apt-get install -y build-essential

      - name: Build the project
        run: make

  build_tarball:
    runs-on: ubuntu-latest
    needs: build  # Depends on the 'build' job

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install automake, autoconf, and other dependencies
        run: sudo apt-get install -y automake autoconf dpkg-dev

      - name: Generate configuration files
        run: autoreconf --install

      - name: Configure the project
        run: ./configure

      - name: Create tarball
        run: make dist

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops16_1.0.orig.tar.gz
          path: devops16-*.tar.gz  # Corrected path to match the generated tarball

  build_deb:
    runs-on: ubuntu-latest
    needs: build_tarball  # Depends on the 'build_tarball' job

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies for Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev devscripts debhelper

      - name: Build Debian package
        run: debuild -b -us -uc

      - name: Move .deb package to the current directory
        run: mv ../*.deb ./

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v4
        with:
          name: devops16-deb-package
          path: ./*.deb
