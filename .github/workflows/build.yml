name: C++ Build and Tarball

on:
  push:
    branches:
      - branchMake
      - branchAutomake
      - branchAutoTest
  pull_request:
    branches:
      - branchMake
      - branchAutomake
      - branchAutoTest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up C++ environment
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Build the project
        run: make

      - name: Build and run unit test
        run: |
          make test
          ./testFuncA

      - name: Run program (if needed)
        run: ./my_program

  build_tarball:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install automake, autoconf
        run: sudo apt-get install -y automake autoconf

      - name: Generate configuration files
        run: autoreconf --install

      - name: Configure the project
        run: ./configure

      - name: Create tarball
        run: make dist

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v3
        with:
          name: DevOps16-tarball
          path: DevOps16-1.0.tar.gz
